/* Crest Secondary visual theme: navy, cyan and sunshine yellow */
:root{--bg:#061e4b;--pane:#0b2c63;--card:#123a78;--line:#438cb7;--ink:#f8fbff;--soft:#d5e9fb;--gold:#ffe400;--green:#47c4e6;--red:#ff9ba5}
body{background:radial-gradient(ellipse at 90% 0%,#12639b 0%,#092e68 38%,#061a40 78%);color:var(--ink)}
.logo span{color:var(--gold)}
.crestlogo{background:white;border:2px solid #4bbfe3;padding:2px;box-shadow:0 5px 20px #02102c77}
.panel{background:linear-gradient(145deg,#113b78 0%,#0a2b61 56%,#071f4b 100%);border-color:#3288ba;box-shadow:0 13px 35px #010d294d}
.resources{background:#0a2b61;border-color:#358bbc}
.resources strong,.eyebrow{color:var(--gold)}
a,.linkbutton{color:#8fe9ff}
a:hover,.linkbutton:hover{text-decoration:underline;color:#fff49b}
.tag,.pill{background:#15447c;border-color:#57badc;color:#edfaff}
.btn{background:#ffe400;color:#092450;box-shadow:0 3px 0 #b9a700;font-weight:850}
.btn:hover:not(:disabled){background:#fff04b}
.btn.secondary{background:#45bfe5;color:#062751;box-shadow:0 3px 0 #227999}
.btn.ghost{background:#153e75;color:#f5fbff;border:1px solid #62c5e5;box-shadow:none}
.hero{background:linear-gradient(112deg,#116caa,#145591 55%,#0c3976);border:1px solid #5ac4eb}
.choice,.option-card{background:#123c79;border-color:#438cbb;color:var(--ink)}
.choice:hover,.choice:focus-visible{background:#19518f;border-color:#ffe400}
.option-card:has(input:checked){background:#1a568a;border-color:#ffe400;box-shadow:inset 4px 0 #ffe400}
.option-card input,.pick input{accent-color:#ffe400}
.progress{background:#174676}
.progress>div{background:linear-gradient(90deg,#43c7e8 0%,#52c2e6 55%,#ffe400 100%)}
.tile{background:#113b73;border-color:#468cb9}
.tile.selected{background:#1b518a;border-color:#ffe400}
.bar{background:#174977}
.metric .bar>div{background:#4ac3e8}
.feedback{background:#134e77;border-color:#5dc3e2}
.feedback strong{color:#ffe875}
.warning{background:#59384c;border-color:#f6a2ae}
.field{background:#0a2958;border-color:#468cba}
.field:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #ffe400;outline-offset:2px}
.hint{background:#164477;border-left-color:#ffe400}
.money{color:#ffe400}
.foot,.mini{color:#d0e4f7}
@media print{.panel,.tile,.feedback,.hint{background:#fff!important;color:#111!important;border-color:#aaa!important}.report,.report *{color:#111!important}}

/* Contrast correction: yellow controls always use deep navy text. */
.btn:not(.secondary):not(.ghost),
.btn:not(.secondary):not(.ghost) *,
button[style*="background:#ffe400"],
button[style*="background: #ffe400"]{color:#071f4b!important}
.btn:not(.secondary):not(.ghost):hover:not(:disabled),
.btn:not(.secondary):not(.ghost):hover:not(:disabled) *{color:#071f4b!important}
.btn.secondary,.btn.secondary *{color:#062751!important}
.btn.ghost,.btn.ghost *{color:#f5fbff!important}
.option-card:has(input:checked),.tile.selected{color:#f8fbff}
/* Preserve clear focus indicators and contrast for keyboard navigation. */
.btn:focus-visible,.choice:focus-visible,.option-card:focus-within{outline:3px solid #ffe400;outline-offset:3px}

/* Crest contrast fix v2: explicit button identities to avoid inherited colours. */
#reset.btn { background:#FFE400 !important; color:#082657 !important; border:2px solid #FFE400 !important; box-shadow:none !important; }
#reset.btn *, #reset.btn::before, #reset.btn::after { color:#082657 !important; }
#reset.btn:hover, #reset.btn:focus-visible { background:#FFF04D !important; color:#082657 !important; }
.btn:not(.ghost):not(.secondary) { color:#082657 !important; }
.btn:not(.ghost):not(.secondary) * { color:#082657 !important; }

const historyKey=store+'_back_history';
let backHistory=[];
try{backHistory=JSON.parse(localStorage.getItem(historyKey))||[];if(!Array.isArray(backHistory))backHistory=[]}catch{backHistory=[]}
function saveHistory(){try{localStorage.setItem(historyKey,JSON.stringify(backHistory.slice(-70)))}catch{}}
function rememberPage(){
  const snapshot=JSON.stringify(s);

function backPage(){

  rememberPage();
},true);

const scoreSort=()=>K.slice().sort((a,b)=>(s.scores[b]||0)-(s.scores[a]||0)||K.indexOf(a)-K.indexOf(b));
function topSubjects(){return scoreSort().slice(0,3)}
function advance(stage,n=0){s.stage=stage;s.n=n;save();render();window.scrollTo({top:0,behavior:'instant'})}
function sourceTitle(k){return DATA.subjects[k].short}
function progress(){const base={welcome:0,route:0,select:s.route==='sure'&&!s.startingChosen.length?1:13,common:1,adaptive:7,recommend:11,experience:14,reconsider:18,courses:19,reflection:20,report:22};return Math.min(22,(base[s.stage]||0)+(s.n||0))}
function side(){let done=progress();$('side').innerHTML=`<div class="row"><strong>🧭 Your decision journey</strong><span class="pill">${Math.round(done/22*100)}%</span></div><div class="progress"><div style="width:${done/22*100}%"></div></div><p class="small">${done} steps · ${s.route==='sure'?'testing my initial choices':s.route==='some'?'comparing my preferences':'guided discovery'}</p><div class="divider"></div><strong>Interest signals</strong><p class="small">Exploration patterns, not grades or suitability scores.</p>${K.map(k=>`<div class="metric"><div class="row"><span>${DATA.subjects[k].icon} ${DATA.subjects[k].short}</span><b>${Math.round(s.scores[k]||0)}</b></div><div class="bar"><div style="width:${Math.min(100,(s.scores[k]||0)*3)}%;background:#74d5dc"></div></div></div>`).join('')}<div class="divider"></div><b>Your provisional pair</b><p>${s.chosen.length?s.chosen.map(sourceTitle).join(' + '):'Not chosen yet'}</p><p class="small">Your choices are provisional. You can reconsider them after subject experiences.</p><div class="divider"></div><p class="small">Information should complement your Discovery Modules, teachers' advice and family conversations.</p>`}
function headline(title,sub,emoji='🧭'){return `<span class="pill">${esc(sub)}</span><div class="hero"><span class="emoji">${emoji}</span><div><h2>${esc(title)}</h2></div></div>`}
function buttons(options,onPick,add=''){ $('main').insertAdjacentHTML('beforeend',`<div class="choices">${options.map((o,i)=>`<button class="choice" data-choice="${i}"><b>${esc(o.text||o)}</b>${o.detail?`<small>${esc(o.detail)}</small>`:''}</button>`).join('')}</div>${add}`);document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>onPick(+b.dataset.choice))}
function getQuestion(){if(s.stage==='common')return DATA.common[s.n];if(s.stage==='adaptive')return s.adaptive[s.n];return null}
function takeAnswer(q,index){const o=q.options[index];s.answers.push({phase:s.stage,title:q.title,answer:o.text,tags:Object.keys(o.score||{})});for(const [k,v] of Object.entries(o.score||{}))s.scores[k]=(s.scores[k]||0)+v;if(s.stage==='common'){if(s.n===5){createAdaptive();advance('adaptive')}else advance('common',s.n+1)}else if(s.n===3)advance('recommend');else advance('adaptive',s.n+1)}
function createAdaptive(){const rank=topSubjects(),vs=DATA.pairTemplates;
s.adaptive=vs.slice(0,3).map((row,i)=>{const [title,story,...opts]=row;const focus=i%3===0?[rank[0],rank[1]]:i%3===1?[rank[1],rank[2]]:[rank[0],rank[2]];const a=focus[0],b=focus[1];return {title,story,options:[{text:opts[K.indexOf(a)],score:{[a]:3}},{text:opts[K.indexOf(b)],score:{[b]:3}},{text:'I would ask both teams to show me what their work involves before deciding',score:{[a]:1,[b]:1}}]}});
const low=scoreSort().slice(-2);DATA.explore.slice(0,1).forEach(([title,story],i)=>{const candidate=low[i];const foil=rank[i];s.adaptive.push({title,story,options:[{text:vs[i+1][2+K.indexOf(candidate)],score:{[candidate]:3}},{text:vs[i+1][2+K.indexOf(foil)],score:{[foil]:2}},{text:'Try both briefly, then decide which I want to practise more',score:{[candidate]:1,[foil]:1}}]})});}
function question(){const q=getQuestion();$('main').innerHTML=headline(q.title,`${s.stage==='common'?'Broad discovery':'Personalised discovery'} · ${s.n+1}/${s.stage==='common'?6:4}`,'🔎')+`<p>${esc(q.story)}</p><p class="small">${s.route==='sure'?'You already have two choices in mind. Use these questions to test your interests honestly, even when an answer points to another subject.':s.route==='some'?'Compare these activities with the subjects you are considering. There is no correct answer.':'Explore the activities that appeal to you. There is no correct answer.'}</p>`;buttons(q.options,i=>takeAnswer(q,i))}
function reality(){const k=K[s.n],p=DATA.subjects[k];$('main').innerHTML=headline(`Get to know ${p.short}`,`Reality check · ${s.n+1}/5`,p.icon)+`<div class="tile"><strong>${esc(p.name)}</strong><p>${esc(p.what)}</p><p>${esc(p.reality)}</p></div><p><b>After reading this, how do you feel about trying this subject?</b></p>`;buttons([{text:'I would enjoy practising these kinds of activities',detail:'I am keen to explore this subject further.'},{text:'I am curious, even though some parts sound challenging',detail:'I would like to find out more before deciding.'},{text:'I appreciate the subject, but may prefer other activities',detail:'It may not match what I want to do regularly.'}],i=>{let delta=[3,1,0][i];s.scores[k]+=delta;s.answers.push({phase:'reality',title:p.short,answer:['Interested','Curious','Less interested'][i],tags:[k]});if(s.n===4)advance('recommend');else advance('reality',s.n+1)})}
function recommendation(){s.recommended=scoreSort().slice(0,2);let a=s.recommended;$('main').innerHTML=headline('Your suggested subjects','Personalised recommendation','✨')+`<p>Based on the activities you preferred, these subjects may be worth serious consideration.</p><div class="grid">${a.map(k=>`<div class="tile"><strong>${DATA.subjects[k].icon} ${DATA.subjects[k].name}</strong><p>${DATA.subjects[k].what}</p></div>`).join('')}</div>${s.route==='sure'?`<p><b>Your original choice:</b> ${s.startingChosen.map(sourceTitle).join(' + ')}. ${s.startingChosen.length===2&&s.startingChosen.every(k=>a.includes(k))?'Great! Your original two choices match the suggested subjects, even if they appear in a different order. Your responses support your existing preferences.':s.startingChosen.filter(k=>a.includes(k)).length===1?'One of your original subjects matches the recommendation. Consider what appeals to you about the other subject, too.':'Your original choices differ from the suggestions. That is perfectly fine: use the results to reflect on your preferences, not to replace them automatically.'}</p>`:''}<p class="hint">These suggestions are not a test of ability, and you are free to disagree. Consider what you actually enjoyed in Crest's Discovery Modules.</p><p><b>Also explore:</b> ${DATA.subjects[scoreSort()[2]].name}. You showed some interest in activities connected to this subject too.</p><div class="actions"><button class="btn" id="next">Choose my own two subjects →</button></div>`;$('next').onclick=()=>{if(s.route==='sure'&&s.startingChosen.length)s.chosen=s.startingChosen.slice();else if(!s.chosen.length)s.chosen=s.recommended.slice();advance('select')} }
function picker(keys,heading){return `<h3>${heading}</h3>${keys.map(k=>`<label class="option-card"><input type="checkbox" value="${k}" class="picksubject" ${s.chosen.includes(k)?'checked':''}> ${DATA.subjects[k].icon} <b>${DATA.subjects[k].short}</b> · ${DATA.subjects[k].name}<div class="small">${DATA.subjects[k].what}<br><em>${DATA.subjects[k].reality}</em></div></label>`).join('')}`}
function choose(){s.chosen=s.chosen||[];$('main').innerHTML=headline('Explore and choose two ISSC subjects','Your choice, not the game’s','🎯')+`<p>${s.route==='sure'&&!s.startingChosen.length?'First, record the two subjects you already have in mind. You will still explore all the broad questions afterwards.':s.route==='sure'?'Your original preferences are pre-selected. You can keep them or change either one.':'The two suggested subjects are pre-selected. You can keep them or change either choice.'} Select exactly two subjects. Your choices are <b>provisional</b>; this is not the school's official submission form.</p>${picker(K,'My two preferred subjects')}<p class="small" id="count">Selected: ${s.chosen.length} of 2</p><div class="actions"><button class="btn" id="commit" ${s.chosen.length!==2?'disabled':''}>Experience these subjects →</button></div>`;document.querySelectorAll('.picksubject').forEach(e=>e.onchange=()=>{const vals=[...document.querySelectorAll('.picksubject:checked')].map(x=>x.value);if(vals.length>2){e.checked=false;return} s.chosen=vals;$('count').textContent=`Selected: ${vals.length} of 2`;$('commit').disabled=vals.length!==2;save()});$('commit').onclick=()=>{if(s.route==='sure'&&!s.startingChosen.length){s.startingChosen=s.chosen.slice();advance('common');return;}s.initialChosen=s.chosen.slice();s.experiences=[];advance('experience')}}
function experience(){let k=s.chosen[Math.floor(s.n/2)],num=s.n%2,q=DATA.scenario[k][num],p=DATA.subjects[k];$('main').innerHTML=headline(q[0],`${p.short} experience · ${num+1}/2 · total ${s.n+1}/4`,p.icon)+`<p>${esc(q[1])}</p><p class="small">Each option is plausible. Think about its benefits and limitations.</p>`;buttons(q[2].map(x=>({text:x})),i=>{s.experiences.push({subject:k,title:q[0],answer:q[2][i],learning:q[3][i]});$('main').innerHTML=headline('What could happen next?',`${p.short} reflection`,'💡')+`<div class="feedback"><strong>${esc(q[2][i])}</strong><p>${esc(q[3][i])}</p></div><p><b>Would you still be interested in learning and practising this kind of work?</b></p>`;buttons([{text:'Yes, this makes me more interested'},{text:'Maybe, I want to explore further'},{text:'Not as much as I expected'}],j=>{s.scores[k]+=[2,1,0][j];s.experiences[s.experiences.length-1].interest=['More interested','Still exploring','Less interested'][j];if(s.n===3)advance('reconsider');else advance('experience',s.n+1)})})}
function reconsider(){let original=s.chosen.slice();$('main').innerHTML=headline('Would you change your mind?','Reconsider your choices','🔁')+`<p>Your first pair was <b>${s.initialChosen.map(sourceTitle).join(' + ')}</b>. After trying four scenarios, would you keep the pair or revise it? ${s.route==='sure'?'Think about one other ISSC subject you might explore as an alternative.':''}</p><div class="grid">${s.chosen.map(k=>`<div class="tile"><strong>${DATA.subjects[k].icon} ${DATA.subjects[k].name}</strong><p>${DATA.subjects[k].reality}</p></div>`).join('')}</div>`;buttons([{text:'Keep these two subjects',detail:'I feel they match what I want to learn.'},{text:'Let me select a different pair',detail:'The scenarios changed how I see the subjects.'}],i=>{if(i===0)advance('courses');else{choose();$('commit').textContent='Confirm revised pair and explore ITE →';$('commit').onclick=()=>{s.reconsidered=true;s.experiences=[];advance('courses')}}})}
function courses(){let n=s.n;const relevant=DATA.courses.filter(c=>c.tags.some(k=>s.chosen.includes(k)));if(n===0){$('main').innerHTML=headline('Where could your interests lead?','ITE exploration · 1/4','🎓')+`<p>These are <b>examples of related ITE Higher Nitec course areas</b>. ISSC selections do not automatically qualify you for admission, and other options may also be available.</p><div class="grid">${relevant.map(c=>`<div class="tile"><strong>${esc(c.name)}</strong><p class="small">${esc(c.description)}</p><small>Connected to ${c.tags.map(sourceTitle).join(', ')}</small></div>`).join('')}</div><div class="actions"><button class="btn" id="continue">Explore course decisions →</button></div>`;$('continue').onclick=()=>advance('reflection');return}
const prompts=[{title:'What makes a course attractive?',story:'You are reading about several ITE programmes. Which information would you investigate first?',opts:['What students actually learn and practise','The activities and projects involved','Future progression and course entry requirements']},{title:'A course sounds interesting, but unfamiliar',story:'You have not tried all of its subjects. How would you explore it?',opts:['Look for course modules and student projects','Ask an ECG counsellor or lecturer about the programme','Attend an open house or talk with someone who studies it']},{title:'Before submitting preferences',story:'You hear that a subject can lead to a particular ITE course. What is your next step?',opts:['Check the latest entry requirements on ITE’s official website','Ask a teacher how the relevant ISSC subject is recognised','Compare several courses rather than assume there is only one route']}];let q=prompts[n-1];$('main').innerHTML=headline(q.title,`ITE exploration · ${n+1}/4`,'🧭')+`<p>${q.story}</p><p class="small">Choose the first step you would take. All options can be useful.</p>`;buttons(q.opts.map(x=>({text:x})),i=>{s.courseInterest.push({prompt:q.title,response:q.opts[i]});if(n===3)advance('reflection');else advance('courses',n+1)})}
function reflection(){
const reasons=[
'I enjoy the activities involved in these subjects',
'These subjects match my strengths and how I like to learn',
'I want to try something new and develop different skills',
'My Discovery Module experiences made me interested',
'I would like to explore the ITE courses related to these subjects'
];
const questions=[
'What will I actually learn and do during lessons?',
'How are the subjects assessed?',
'What should I do if I find the subject challenging?',
'Which ITE courses could these subjects help me explore?',
'How can I decide between two subjects I like equally?'
];
const steps=[
'Ask an ISSC teacher about lessons and assessments',
'Discuss my choices with my parent or caregiver',
'Explore related ITE courses and admission criteria',
'Review what I enjoyed during Discovery Modules',
'Speak to an ECG counsellor'
];
if(s.n===0){
$('main').innerHTML=headline('Why these two subjects?','Personal reflection · 1/2','📝')+`<p><b>What is your main reason for choosing ${s.chosen.map(sourceTitle).join(' and ')}?</b></p><p class="small">Choose the reason that fits you best. There is no wrong answer.</p><div class="choices">${reasons.map((x,i)=>`<label class="choice pick"><input type="radio" name="why" value="${i}" ${s.reflections.why===x?'checked':''}>${esc(x)}</label>`).join('')}</div><p><b>How confident are you about your choices?</b></p><div class="choices">${['Very confident','Fairly confident','Still unsure'].map((x,i)=>`<label class="choice pick"><input type="radio" name="confidence" value="${i}" ${s.reflections.confidence===x?'checked':''}>${x}</label>`).join('')}</div><div class="actions"><button class="btn" id="next">Continue →</button></div>`;
$('next').onclick=()=>{let w=document.querySelector('input[name="why"]:checked'),c=document.querySelector('input[name="confidence"]:checked');if(!w||!c){alert('Please choose one answer for each question.');return}s.reflections.why=reasons[+w.value];s.reflections.confidence=['Very confident','Fairly confident','Still unsure'][+c.value];advance('reflection',1)};return;
}
$('main').innerHTML=headline('Your next steps','Personal reflection · 2/2','🗓️')+`<p><b>Which question would you most like answered before submitting your choices?</b></p><div class="choices">${questions.map((x,i)=>`<label class="choice pick"><input type="radio" name="question" value="${i}" ${s.reflections.question===x?'checked':''}>${esc(x)}</label>`).join('')}</div><p><b>What will you do next?</b></p><div class="choices">${steps.map((x,i)=>`<label class="choice pick"><input type="radio" name="nextstep" value="${i}" ${s.reflections.next===x?'checked':''}>${esc(x)}</label>`).join('')}</div><div class="actions"><button class="btn" id="finish">Create my decision card →</button></div>`;
$('finish').onclick=()=>{let q=document.querySelector('input[name="question"]:checked'),v=document.querySelector('input[name="nextstep"]:checked');if(!q||!v){alert('Please choose one answer for each question.');return}s.reflections.question=questions[+q.value];s.reflections.next=steps[+v.value];advance('report')};
}
function reportMarkup(){let selected=s.chosen,reco=s.recommended,match=selected.filter(k=>reco.includes(k)).length;return `<div class="report"><h2>ISSC Decision Card</h2><p><b>Student:</b> ${esc(s.name||'Student')} &nbsp; <b>School level:</b> Secondary 2</p><p><b>My provisional choices:</b> ${selected.map(k=>esc(DATA.subjects[k].name)).join(' & ')}.</p>${s.route==='sure'?'<p><b>My starting preferences:</b> ${s.startingChosen.map(k=>DATA.subjects[k].name).join(' & ')}.</p><p><b>Suggestions from discovery:</b> ${reco.map(k=>DATA.subjects[k].name).join(' & ')}.</p>':`<p><b>Suggestions from the discovery questions:</b> ${reco.map(k=>DATA.subjects[k].name).join(' & ')}.</p>`}<p class="small">${s.route==='sure'?'The broad questions and scenarios helped you test your initial preferences. A different suggestion does not invalidate your choice.':match===2?'Your choices match both suggestions.':match===1?'One choice matches the suggestions. That is completely fine.':'You chose two different subjects from the suggestions. This is also valid.'} Suggestions reflect activity preferences, not ability or guaranteed suitability.</p><h3>What I may learn</h3>${selected.map(k=>`<div class="tile"><strong>${DATA.subjects[k].name}</strong><p>${DATA.subjects[k].what}</p><p><i>${DATA.subjects[k].reality}</i></p></div>`).join('')}<h3>My reason</h3><p>${esc(s.reflections.why)}</p><p><b>Confidence:</b> ${esc(s.reflections.confidence)}</p><h3>Possible related ITE courses to explore</h3><p>${DATA.courses.filter(c=>c.tags.some(k=>selected.includes(k))).map(c=>esc(c.name)).join(' · ')}</p><p class="small">Course links are examples of subject-area relevance, NOT eligibility decisions or guaranteed admission. Check the current ITE Course Finder, prerequisites and available intake.</p><h3>My question</h3><p>${esc(s.reflections.question)}</p><h3>My next action</h3><p>${esc(s.reflections.next)}</p><p><b>Important:</b> This is a provisional reflection, not the school's official subject submission. Discuss it with your teachers and family before deciding.</p><p class="small">Useful references: www.crestsec.edu.sg/learning-at-crest/vocational-tracks/ · www.ite.edu.sg/course-finder/ · www.myskillsfuture.gov.sg</p></div>`}
function report(){ $('main').innerHTML=headline('You are ready to reflect','Your ISSC decision card','🏅')+reportMarkup()+`<div class="actions hidden-print"><button class="btn" id="pdf">Print / Save as PDF</button><button class="btn secondary" id="txt">Download text card</button><button class="btn ghost" id="revise">Review my choices</button></div>`;$('pdf').onclick=()=>window.print();$('txt').onclick=()=>{const plain=`ISSC DECISION CARD\nStudent: ${s.name}\nMy provisional choices: ${s.chosen.map(k=>DATA.subjects[k].name).join(' + ')}\n${s.route==='sure'?'Starting preferences: '+s.startingChosen.map(k=>DATA.subjects[k].name).join(' + ')+'\nGame recommendations: '+s.recommended.map(k=>DATA.subjects[k].name).join(' + '):'Game recommendations: '+s.recommended.map(k=>DATA.subjects[k].name).join(' + ')}\nReason: ${s.reflections.why}\nConfidence: ${s.reflections.confidence}\nQuestion: ${s.reflections.question}\nNext action: ${s.reflections.next}\nPossible related ITE courses (not admission eligibility): ${DATA.courses.filter(c=>c.tags.some(k=>s.chosen.includes(k))).map(c=>c.name).join(', ')}\nNot an official submission.`;const blob=new Blob([plain],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ISSC_Decision_Card.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('revise').onclick=()=>advance('select')}
function routePage(){$('main').innerHTML=headline('How certain are you?','Choose your exploration route','🧭')+`<p>Have you already decided which two ISSC subjects you want to study? Choose the answer that best describes you.</p>`;buttons([{text:'Yes, I know my two subjects',detail:'Record my choices, then test them through all broad discovery questions.'},{text:'I have some preferences',detail:'Explore all broad questions while comparing my preferences.'},{text:'I am still exploring',detail:'Explore all broad questions before choosing.'}],i=>{s.route=['sure','some','explore'][i];s.answers=[];s.adaptive=[];s.scores=Object.fromEntries(K.map(k=>[k,0]));s.recommended=[];s.chosen=[];s.startingChosen=[];s.experiences=[];if(i===0)advance('select');else advance('common')})}
function welcome(){$('main').innerHTML=headline('Explore five. Choose two.','Choose the journey that fits you','🧭')+`<p>You're in Secondary 2 at Crest. You've experienced Discovery Modules and attended a briefing. Before you decide which <b>two ISSC subjects</b> to study in Secondary 3 and 4, explore your interests and test your expectations.</p><div class="grid"><div class="tile"><strong>🔎 Discover</strong><p>Guided questions if you are undecided.</p></div><div class="tile"><strong>🧪 Explore</strong><p>Read about all five ISSC subjects when choosing.</p></div><div class="tile"><strong>🛠️ Experience</strong><p>Two scenarios per chosen subject.</p></div><div class="tile"><strong>🎓 Reflect</strong><p>ITE connections and a decision card.</p></div></div><p class="hint">No subject is the 'best' for everyone. The game suggests; you decide.</p><label>Your first name or nickname (optional)<input id="playername" class="field" maxlength="36" placeholder="Your name" value="${esc(s.name)}"></label><div class="actions"><button class="btn" id="start">Continue →</button></div>`;$('start').onclick=()=>{s.name=$('playername').value.trim()||'Student';advance('route')}}
function render(){const back=$('back');if(back)back.disabled=!backHistory.length;side();switch(s.stage){case'welcome':return welcome();case'route':return routePage();case'common':case'adaptive':return question();case'reality':return reality();case'recommend':return recommendation();case'select':return choose();case'experience':return experience();case'reconsider':return reconsider();case'courses':return courses();case'reflection':return reflection();case'report':return report();default:s=initial();return welcome()}}
$('back').onclick=backPage;
$('reset').onclick=()=>{if(confirm('Restart and clear this saved journey?')){s=initial();backHistory=[];saveHistory();save();render()}};
$('help').onclick=()=>{$('modal').innerHTML=`<h2>How to use ISSC Explorer</h2><p>1. Choose how certain you are. Everyone explores six broad questions and four personalised follow-ups.</p><p>2. Consider the suggestions, then choose any two ISSC subjects.</p><p>3. Experience two non-technical scenarios for each.</p><p>4. Reconsider your selections and explore related ITE courses.</p><p>5. Print or download a provisional decision card to discuss with your family or teachers.</p><p>This game does not submit your selections to Crest. Results are saved only in this browser.</p><p><b>Explore ITE courses:</b> <a href="https://www.ite.edu.sg/course-finder/" target="_blank" rel="noopener noreferrer">Official ITE Course Finder ↗</a></p><p><b>Career guidance:</b> <a href="https://www.myskillsfuture.gov.sg/content/student/en/secondary-v2/resources/ecg-resources.html" target="_blank" rel="noopener noreferrer">MySkillsFuture ECG Resources ↗</a></p><button class="btn" id="close">Close</button>`;$('overlay').classList.remove('hidden');$('close').onclick=()=>$('overlay').classList.add('hidden')};
$('overlay').onclick=e=>{if(e.target.id==='overlay')$('overlay').classList.add('hidden')};render();

</script></body></html>
